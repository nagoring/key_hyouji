<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>key_hyouji ring</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      .ring {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 70%;
        height: 70%;
        box-sizing: border-box;
        border-radius: 50%;
        border: 4px solid var(--color, #ffcc00);
        opacity: 0;
      }
      .ring.right { border-style: double; border-width: 7px; }
      .ring.middle { border-style: dashed; }
      .ring.play { animation: ripple 450ms ease-out forwards; }
      @keyframes ripple {
        0% { transform: scale(0.3); opacity: 0.95; }
        100% { transform: scale(1.3); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div class="ring" id="ring"></div>
    <script type="module" src="/src/ring.ts"></script>
  </body>
</html>
