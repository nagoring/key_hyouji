<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>key_hyouji</title>
    <link rel="stylesheet" href="/src/onboarding.css" />
  </head>
  <body>
    <main>
      <div class="hero">
        <img src="/icon.png" alt="" width="72" height="72" />
        <div>
          <h1 data-i18n="onb.title"></h1>
          <p data-i18n="onb.lead"></p>
        </div>
      </div>

      <div id="status" class="status"></div>

      <ol class="steps" id="steps">
        <li data-i18n="onb.step1"></li>
        <li data-i18n-html="onb.step2"></li>
        <li data-i18n="onb.step3"></li>
      </ol>

      <p class="note" data-i18n="onb.note"></p>

      <div class="actions">
        <button id="openSettings" data-i18n="onb.open"></button>
        <button id="restart" class="secondary" data-i18n="onb.restart" hidden></button>
        <button id="close" class="secondary" data-i18n="onb.close" hidden></button>
      </div>
    </main>
    <script type="module" src="/src/onboarding.ts"></script>
  </body>
</html>
