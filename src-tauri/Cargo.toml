[package]
name = "key_hyouji"
version = "0.1.0"
description = "Keystroke display overlay for Windows and macOS"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
key_core = { path = "../crates/key_core" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
